<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五子棋 AI（連珠 Renju 規則）</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #333; margin-bottom: 10px; }
    .controls {
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    label { font-weight: bold; color: #555; }
    select, button {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: white;
      transition: 0.2s;
    }
    button:hover { background: #e0e0e0; }
    #status {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #d9534f;
      min-height: 24px;
    }
    #board-container {
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border-radius: 8px;
      overflow: hidden;
      background: #e6b074;
    }
    canvas { display: block; cursor: pointer; }
  </style>
</head>
<body>

  <h1>連珠五子棋 AI 對戰</h1>
  
  <div class="controls">
    <div>
      <label for="difficulty">AI 難度：</label>
      <select id="difficulty">
        <option value="1">簡單 (Easy)</option>
        <option value="2" selected>中等 (Medium)</option>
        <option value="3">困難 (Hard)</option>
      </select>
    </div>

    <div>
      <label for="playerColor">玩家執棋：</label>
      <select id="playerColor">
        <option value="1" selected>黑棋 (先手)</option>
        <option value="2">白棋 (後手)</option>
      </select>
    </div>

    <button onclick="resetGame()">重新開始</button>
    <button onclick="undoMove()">悔棋</button>
  </div>

  <div id="status">遊戲開始！黑棋先手</div>

  <div id="board-container">
    <canvas id="board" width="540" height="540"></canvas>
  </div>

<script>
const CANVAS_SIZE = 540;
const GRID_SIZE = 15;
const PADDING = 24;
const CELL_SIZE = (CANVAS_SIZE - PADDING * 2) / (GRID_SIZE - 1);

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');

// 0: 空地, 1: 黑棋, 2: 白棋
let board = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
let historyStack = [];
let currentPlayer = 1; // 1: 黑, 2: 白
let humanColor = 1;
let aiDifficulty = 2;
let gameOver = false;

// 初始化與繪圖
function init() {
  document.getElementById('difficulty').addEventListener('change', (e) => {
    aiDifficulty = parseInt(e.target.value);
  });
  
  document.getElementById('playerColor').addEventListener('change', (e) => {
    humanColor = parseInt(e.target.value);
    resetGame();
  });

  canvas.addEventListener('click', handleCanvasClick);
  resetGame();
}

function resetGame() {
  board = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
  historyStack = [];
  currentPlayer = 1;
  gameOver = false;
  humanColor = parseInt(document.getElementById('playerColor').value);
  aiDifficulty = parseInt(document.getElementById('difficulty').value);
  
  updateStatus(humanColor === 1 ? "遊戲開始！請黑棋落子" : "AI 思考中...");
  drawBoard();

  if (humanColor === 2) {
    setTimeout(makeAIMove, 500);
  }
}

function drawBoard() {
  // 背景木紋色
  ctx.fillStyle = '#e6b074';
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  // 繪製網格
  ctx.strokeStyle = '#402a15';
  ctx.lineWidth = 1;
  for (let i = 0; i < GRID_SIZE; i++) {
    // 橫線
    ctx.beginPath();
    ctx.moveTo(PADDING, PADDING + i * CELL_SIZE);
    ctx.lineTo(CANVAS_SIZE - PADDING, PADDING + i * CELL_SIZE);
    ctx.stroke();
    // 直線
    ctx.beginPath();
    ctx.moveTo(PADDING + i * CELL_SIZE, PADDING);
    ctx.lineTo(PADDING + i * CELL_SIZE, CANVAS_SIZE - PADDING);
    ctx.stroke();
  }

  // 標記星位 (3, 3), (11, 3), (7, 7), (3, 11), (11, 11)
  const starPoints = [[3,3], [11,3], [7,7], [3,11], [11,11]];
  ctx.fillStyle = '#402a15';
  starPoints.forEach(([r, c]) => {
    ctx.beginPath();
    ctx.arc(PADDING + c * CELL_SIZE, PADDING + r * CELL_SIZE, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  // 繪製棋子
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (board[r][c] !== 0) {
        drawPiece(r, c, board[r][c]);
      }
    }
  }

  // 高亮最新落子
  if (historyStack.length > 0) {
    const last = historyStack[historyStack.length - 1];
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(PADDING + last.c * CELL_SIZE, PADDING + last.r * CELL_SIZE, CELL_SIZE * 0.2, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawPiece(r, c, color) {
  const x = PADDING + c * CELL_SIZE;
  const y = PADDING + r * CELL_SIZE;
  const radius = CELL_SIZE * 0.43;

  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);

  const gradient = ctx.createRadialGradient(
    x - radius * 0.3, y - radius * 0.3, radius * 0.1,
    x, y, radius
  );

  if (color === 1) { // 黑棋
    gradient.addColorStop(0, '#666');
    gradient.addColorStop(1, '#000');
  } else { // 白棋
    gradient.addColorStop(0, '#fff');
    gradient.addColorStop(1, '#ccc');
  }

  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.strokeStyle = color === 1 ? '#000' : '#aaa';
  ctx.stroke();
}

// 玩家點擊
function handleCanvasClick(e) {
  if (gameOver || currentPlayer !== humanColor) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const c = Math.round((x - PADDING) / CELL_SIZE);
  const r = Math.round((y - PADDING) / CELL_SIZE);

  if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE && board[r][c] === 0) {
    // Renju 規則判定：黑棋禁手檢查
    if (currentPlayer === 1) {
      const foul = checkFoul(r, c);
      if (foul) {
        alert(`【黑棋禁手違規】違規類型：${foul}！黑棋判負。`);
        board[r][c] = 1;
        drawBoard();
        gameOver = true;
        updateStatus("黑棋觸發禁手，白棋獲勝！");
        return;
      }
    }

    placePiece(r, c, currentPlayer);

    if (checkWin(r, c, currentPlayer)) {
      gameOver = true;
      updateStatus(`${currentPlayer === 1 ? '黑棋' : '白棋'} 獲勝！`);
      return;
    }

    currentPlayer = 3 - currentPlayer;
    updateStatus("AI 思考中...");
    
    setTimeout(makeAIMove, 100);
  }
}

function placePiece(r, c, color) {
  board[r][c] = color;
  historyStack.push({ r, c, color });
  drawBoard();
}

function undoMove() {
  if (gameOver || historyStack.length < 2) return;
  
  // 退回兩步（玩家 + AI）
  let p1 = historyStack.pop();
  board[p1.r][p1.c] = 0;
  let p2 = historyStack.pop();
  board[p2.r][p2.c] = 0;

  drawBoard();
  updateStatus("已悔棋，請落子");
}

function updateStatus(text) {
  statusDiv.innerText = text;
}

// ==================== 連珠 (Renju) 規則檢查 ====================
// 連續計數
function countDirection(r, c, dr, dc, color) {
  let count = 0;
  let nr = r + dr;
  let nc = c + dc;
  while (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && board[nr][nc] === color) {
    count++;
    nr += dr;
    nc += dc;
  }
  return count;
}

function checkWin(r, c, color) {
  const dirs = [[0,1], [1,0], [1,1], [1,-1]];
  for (let [dr, dc] of dirs) {
    let count = 1 + countDirection(r, c, dr, dc, color) + countDirection(r, c, -dr, -dc, color);
    if (color === 2 && count >= 5) return true; // 白棋長連 (>=5) 皆算勝
    if (color === 1 && count === 5) return true; // 黑棋必須恰好 5 連
  }
  return false;
}

// 黑棋禁手判斷 (長連、三三、四四)
function checkFoul(r, c) {
  board[r][c] = 1; // 模擬落子

  const dirs = [[0,1], [1,0], [1,1], [1,-1]];
  
  // 1. 長連 (Overline: >5 連)
  for (let [dr, dc] of dirs) {
    let count = 1 + countDirection(r, c, dr, dc, 1) + countDirection(r, c, -dr, -dc, 1);
    if (count > 5) {
      board[r][c] = 0;
      return "長連禁手 (連超過五子)";
    }
  }

  // 簡化版 Double-3 / Double-4 檢測 (連珠極其複雜，此為實用級基礎過濾)
  let threeCount = 0;
  let fourCount = 0;

  for (let [dr, dc] of dirs) {
    let lineStr = getLinePattern(r, c, dr, dc);
    if (lineStr.includes('01110')) threeCount++;
    if (lineStr.includes('011110') || lineStr.includes('211110') || lineStr.includes('011112')) fourCount++;
  }

  board[r][c] = 0; // 還原

  if (threeCount >= 2) return "三三禁手 (同時形成雙活三)";
  if (fourCount >= 2) return "四四禁手 (同時形成雙四)";

  return null;
}

function getLinePattern(r, c, dr, dc) {
  let str = "";
  for (let i = -4; i <= 4; i++) {
    let nr = r + dr * i;
    let nc = c + dc * i;
    if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
      str += board[nr][nc];
    } else {
      str += '2'; // 邊界視為對方障礙
    }
  }
  return str;
}

// ==================== AI 演算法 (Minimax + Alpha-Beta) ====================
function makeAIMove() {
  if (gameOver) return;

  let bestMove = getBestMove(aiDifficulty);
  if (bestMove) {
    const aiColor = 3 - humanColor;
    
    // 如果 AI 執黑，需要檢查禁手
    if (aiColor === 1 && checkFoul(bestMove.r, bestMove.c)) {
      // 若最佳解為禁手，尋找次佳解
      bestMove = getFallbackMove();
    }

    placePiece(bestMove.r, bestMove.c, aiColor);

    if (checkWin(bestMove.r, bestMove.c, aiColor)) {
      gameOver = true;
      updateStatus("AI 贏了！");
      return;
    }

    currentPlayer = humanColor;
    updateStatus("輪到你了");
  }
}

function getCandidateMoves() {
  let candidates = [];
  let visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));

  // 僅搜尋已有棋子周圍 2 格內的空點，大幅增進極大極小樹搜尋速度
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (board[r][c] !== 0) {
        for (let dr = -2; dr <= 2; dr++) {
          for (let dc = -2; dc <= 2; dc++) {
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && board[nr][nc] === 0 && !visited[nr][nc]) {
              visited[nr][nc] = true;
              candidates.push({ r: nr, c: nc });
            }
          }
        }
      }
    }
  }

  if (candidates.length === 0) {
    candidates.push({ r: 7, c: 7 }); // 開局天元
  }
  return candidates;
}

function getBestMove(depth) {
  const candidates = getCandidateMoves();
  const aiColor = 3 - humanColor;

  // 簡單難度：隨機 + 基礎啟發式評估
  if (depth === 1) {
    candidates.sort((a, b) => evaluatePoint(b.r, b.c, aiColor) - evaluatePoint(a.r, a.c, aiColor));
    // 增加隨機擾動
    let index = Math.floor(Math.random() * Math.min(3, candidates.length));
    return candidates[index];
  }

  // 中等 (Depth 2) / 困難 (Depth 3) 使用 Minimax + Alpha-Beta
  let bestScore = -Infinity;
  let bestMove = candidates[0];

  for (let move of candidates) {
    board[move.r][move.c] = aiColor;
    let score = minimax(depth - 1, false, -Infinity, Infinity, aiColor);
    board[move.r][move.c] = 0;

    if (score > bestScore) {
      bestScore = score;
      bestMove = move;
    }
  }
  return bestMove;
}

function minimax(depth, isMaximizing, alpha, beta, aiColor) {
  if (depth === 0) {
    return evaluateBoard(aiColor);
  }

  const candidates = getCandidateMoves();

  if (isMaximizing) {
    let maxEval = -Infinity;
    for (let move of candidates) {
      board[move.r][move.c] = aiColor;
      let evalVal = minimax(depth - 1, false, alpha, beta, aiColor);
      board[move.r][move.c] = 0;
      maxEval = Math.max(maxEval, evalVal);
      alpha = Math.max(alpha, evalVal);
      if (beta <= alpha) break;
    }
    return maxEval;
  } else {
    let minEval = Infinity;
    const oppColor = 3 - aiColor;
    for (let move of candidates) {
      board[move.r][move.c] = oppColor;
      let evalVal = minimax(depth - 1, true, alpha, beta, aiColor);
      board[move.r][move.c] = 0;
      minEval = Math.min(minEval, evalVal);
      beta = Math.min(beta, evalVal);
      if (beta <= alpha) break;
    }
    return minEval;
  }
}

// 局勢估值函數
function evaluateBoard(aiColor) {
  const oppColor = 3 - aiColor;
  let aiScore = 0;
  let oppScore = 0;

  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (board[r][c] === aiColor) {
        aiScore += evaluatePoint(r, c, aiColor);
      } else if (board[r][c] === oppColor) {
        oppScore += evaluatePoint(r, c, oppColor);
      }
    }
  }
  return aiScore - oppScore * 1.2; // 稍微偏向防守權重
}

function evaluatePoint(r, c, color) {
  let score = 0;
  const dirs = [[0,1], [1,0], [1,1], [1,-1]];
  
  for (let [dr, dc] of dirs) {
    let count = 1 + countDirection(r, c, dr, dc, color) + countDirection(r, c, -dr, -dc, color);
    if (count >= 5) score += 100000;
    else if (count === 4) score += 5000;
    else if (count === 3) score += 500;
    else if (count === 2) score += 50;
  }
  return score;
}

function getFallbackMove() {
  const candidates = getCandidateMoves();
  return candidates[Math.floor(Math.random() * candidates.length)];
}

// 啟動遊戲
window.onload = init;
</script>
</body>
</html>
